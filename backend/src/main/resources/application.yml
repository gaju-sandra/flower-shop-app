# Bloom & Co. API configuration.
# Every value can be overridden by an environment variable or by a line in backend/.env
# (KEY=value, no quotes), which is imported below.
spring:
  application:
    name: bloom-backend
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flower_shop_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 15
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing database created by an earlier version is adopted as version 1.
    baseline-on-migrate: true
    baseline-version: 1

  # MongoDB and RabbitMQ are wired manually (see MongoConfig / RabbitConfig) so the
  # API still starts - with in-memory fallbacks - when they are not configured.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
    time-zone: UTC

server:
  port: ${PORT:5000}
  compression:
    enabled: true
    mime-types: application/json,text/csv,text/plain
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: BLOOM_OAUTH_SESSION
        http-only: true
        same-site: lax

app:
  client-url: ${CLIENT_URL:http://localhost:5173}
  server-url: ${SERVER_URL:http://localhost:5000}
  upload-dir: ${UPLOAD_DIR:uploads}
  seed-on-startup: ${SEED_ON_STARTUP:true}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-change-me-please-32-bytes-min}
    access-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-ttl-days: 1
    refresh-ttl-days-remember: 30
  mongo:
    uri: ${MONGO_URI:}
  rabbit:
    url: ${RABBITMQ_URL:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # {baseUrl} is the URL the browser used, so this also works through the Vite dev proxy
    redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/api/auth/oauth/{registrationId}/callback}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    from: ${MAIL_FROM:Bloom & Co. <hello@bloomandco.rw>}
  sms:
    api-key: ${SMS_API_KEY:}
    sender: ${SMS_SENDER:BLOOMCO}

logging:
  level:
    root: INFO
    org.mongodb.driver: WARN
    org.springframework.amqp: WARN
    rw.bloomco: INFO
